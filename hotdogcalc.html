<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Dog Calc</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 1rem;
    }
    h1 {
      margin-top: 12vh;
      font-size: clamp(2rem, 9vw, 2.5em);
      letter-spacing: 2px;
    }
    p {
      max-width: 36rem;
      margin: 1.5rem auto;
      line-height: 1.6;
      font-size: clamp(1rem, 3.5vw, 1.05rem);
      padding: 0 0.5rem;
    }
    form {
      display: inline-flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
      padding-top: 1rem;
    }
    label {
      display: block;
      font-size: 1rem;
      text-align: left;
      width: 100%;
    }
    input,
    button {
      width: 100%;
      max-width: 100%;
      font-size: 1rem;
      padding: 0.9rem 1rem;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input {
      border: 1px solid #fff;
      background: #111;
      color: #fff;
    }
    button {
      border: 2px solid red;
      background: rgba(255, 0, 0, 0.1);
      color: #fff;
      cursor: pointer;
    }
    .hotdog-button {
      width: min(100%, 320px);
      display: inline-block;
      margin: 0 auto;
    }
    #results {
      width: 100%;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }
    .hotdog-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      max-width: 100%;
      height: 70px;
      padding: 0 1.75rem;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      margin: 0 auto;
      background: linear-gradient(to bottom, #e8b35c 0%, #d99a3f 45%, #c98530 100%);
      box-shadow:
        inset 0 -6px 8px rgba(120, 70, 10, 0.35),
        inset 0 4px 6px rgba(255, 240, 210, 0.6),
        0 4px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .hotdog-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 -6px 8px rgba(120, 70, 10, 0.35),
        inset 0 4px 6px rgba(255, 240, 210, 0.6),
        0 8px 14px rgba(0, 0, 0, 0.3);
    }
    .hotdog-btn:active {
      transform: translateY(1px);
    }
    .hotdog-btn::before {
      content: "";
      position: absolute;
      left: -10px;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(to bottom, #b5451f 0%, #8f2f13 55%, #7a260f 100%);
      box-shadow:
        inset 0 3px 4px rgba(255, 180, 140, 0.5),
        inset 0 -4px 6px rgba(0, 0, 0, 0.35);
    }
    .hotdog-btn .mustard-text {
      position: relative;
      z-index: 3;
      font-family: 'Permanent Marker', cursive;
      color: #f4c430;
      font-size: 20px;
      font-weight: 400;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
      pointer-events: none;
    }
    a.hotdog-button {
      margin-top: 1.5rem;
    }
    a {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      text-decoration: none;
      color: red;
      padding: 1em 2em;
      background: rgba(255, 0, 0, 0.1);
      border: 2px solid red;
      border-radius: 4px;
      margin-top: 2em;
      width: min(100%, 320px);
      box-sizing: border-box;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      form {
        gap: 0.75rem;
      }
      input,
      button,
      a {
        font-size: 1rem;
      }
    }
    .hotdog-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
      max-width: 360px;
      margin: 1.5rem auto 2rem;
      padding: 0 0.5rem;
      box-sizing: border-box;
    }
    .gallery-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      min-width: 0;
    }
    .gallery-tile {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 2px solid #ffe436;
      background-color: #111;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      box-sizing: border-box;
    }
    .gallery-rank {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffe436;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      z-index: 2;
    }
    .gallery-count {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffe436;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      z-index: 2;
    }
    .gallery-name {
      max-width: 100%;
      font-weight: bold;
      color: #ffe436;
      font-size: clamp(0.65rem, 3vw, 0.85rem);
      word-break: break-word;
      text-align: center;
    }
    @media (max-width: 480px) {
      .hotdog-gallery {
        gap: 0.5rem;
      }
    }
    #leaderboard-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content {
      background-color: #1a1a1a;
      border: 3px solid #ffe436;
      border-radius: 8px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .modal-content h2 {
      color: #ffe436;
      margin-top: 0;
      font-size: 1.5rem;
    }
    #name-input {
      background: #111;
      border: 2px solid #ffe436;
      color: #fff;
      padding: 0.75rem;
      margin: 1rem 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .modal-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .modal-buttons button {
      width: auto;
      padding: 0.75rem 1.5rem;
    }
    .modal-buttons button.hotdog-btn {
      min-width: 130px;
      height: 56px;
      margin-top: 0;
    }
    .modal-buttons .hotdog-btn .mustard-text {
      font-size: 16px;
    }
    #leaderboard-section {
      display: none;
      width: 100%;
      margin-top: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    #leaderboard-section h3 {
      color: #ffe436;
      font-size: 1.3rem;
      margin-bottom: 1rem;
    }
    #image-input {
      margin: 1rem 0;
    }
    #image-preview {
      display: none;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #ffe436;
      margin: 0 auto 1rem;
    }
    .gallery-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 2;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #ff4d4d;
      color: #ff4d4d;
      cursor: pointer;
      padding: 0;
      width: 1.6rem;
      height: 1.6rem;
      font-size: 1rem;
      line-height: 1;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>Hot Dog Calc</h1>
  <p>How far are you from achieving your hotdog dreams?</p>

  <form id="hotdog-form">
    <label for="hotdogs-eaten">Hot Dogs Eaten:</label>
    <input id="hotdogs-eaten" name="hotdogs-eaten" type="number" min="0" max="100" required>
    <button type="submit" class="hotdog-btn"><span class="mustard-text">CALCULATE</span></button>
  </form>

  <section id="results" style="display:none;">
    <p id="remaining"></p>
    <p id="per-day"></p>
    <p id="per-week"></p>
    <button id="save-to-leaderboard" class="hotdog-btn"><span class="mustard-text">SAVE TO LEADERBOARD</span></button>
  </section>

  <section id="leaderboard-section">
    <h3>TOP DOGS</h3>
    <div class="hotdog-gallery" id="hotdog-gallery"></div>
  </section>

  <div id="leaderboard-modal">
    <div class="modal-content">
      <h2>Add to the Leaderboard</h2>
      <label for="name-input">Add your name</label>
      <input type="text" id="name-input" placeholder="Your name" maxlength="20">
      <label for="image-input">Add photo evidence of your latest dog!</label>
      <input type="file" id="image-input" accept="image/*">
      <img id="image-preview" alt="Selected photo preview">
      <div class="modal-buttons">
        <button id="modal-save" class="hotdog-btn"><span class="mustard-text">SAVE</span></button>
        <button id="modal-cancel" class="hotdog-btn"><span class="mustard-text">CANCEL</span></button>
      </div>
    </div>
  </div>

  <script>
    const hotdogsInput = document.getElementById('hotdogs-eaten');
    const form = document.getElementById('hotdog-form');
    const resultsSection = document.getElementById('results');
    const remainingText = document.getElementById('remaining');
    const perDayText = document.getElementById('per-day');
    const perWeekText = document.getElementById('per-week');
    const saveToLeaderboardBtn = document.getElementById('save-to-leaderboard');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const nameInput = document.getElementById('name-input');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const modalSaveBtn = document.getElementById('modal-save');
    const modalCancelBtn = document.getElementById('modal-cancel');
    const leaderboardSection = document.getElementById('leaderboard-section');
    const hotdogGallery = document.getElementById('hotdog-gallery');
    const GALLERY_SIZE = 9;

    const API_BASE_URL = window.API_BASE_URL || (
      window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:3000'
        : 'https://rossrosenbaum-github-io.onrender.com'
    );
    let currentHotdogsEaten = 0;
    const LEADERBOARD_KEY = 'hotdog-leaderboard';

    function getDaysAndWeeksLeft() {
      const now = new Date();
      const endOfYear = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
      const msLeft = endOfYear - now;
      const daysLeft = Math.ceil(msLeft / (1000 * 60 * 60 * 24));
      const weeksLeft = daysLeft / 7;
      return { daysLeft, weeksLeft };
    }

    async function fetchLeaderboard() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/leaderboard`);
        if (res.ok) {
          const json = await res.json();
          return json.entries || [];
        }
      } catch (e) {
        console.warn('Failed to fetch leaderboard', e);
      }
      return [];
    }

    function compressImageFile(file, maxSize = 200, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function saveScoreToServer(name, image) {
      try {
        const res = await fetch(`${API_BASE_URL}/api/leaderboard`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, hotdogs: currentHotdogsEaten, image: image || null })
        });
        if (res.ok) {
          const json = await res.json();
          return json.entries || [];
        }
      } catch (e) {
        console.warn('Failed to save score', e);
      }
      return [];
    }

    async function deleteLeaderboardEntry(name) {
      try {
        const res = await fetch(`${API_BASE_URL}/api/leaderboard/${encodeURIComponent(name)}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          const json = await res.json();
          return json.entries || [];
        }
      } catch (e) {
        console.warn('Failed to delete score', e);
      }
      return [];
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderGallery(sortedEntries) {
      hotdogGallery.innerHTML = sortedEntries
        .slice(0, GALLERY_SIZE)
        .map((entry, idx) => {
          const rank = idx + 1;
          const deleteButton = `<button class="gallery-delete" type="button" data-name="${escapeHtml(entry.name)}" aria-label="Delete ${escapeHtml(entry.name)}">×</button>`;
          const tileStyle = entry.image ? ` style="background-image:url('${escapeHtml(entry.image)}')"` : '';
          return `
            <div class="gallery-card">
              <div class="gallery-tile"${tileStyle}>
                <span class="gallery-rank">#${rank}</span>
                <span class="gallery-count">${entry.hotdogs}</span>
                ${deleteButton}
              </div>
              <span class="gallery-name">${escapeHtml(entry.name)}</span>
            </div>
          `;
        })
        .join('');
    }

    async function displayLeaderboard() {
      const entries = await fetchLeaderboard();
      const sortedEntries = entries.slice().sort((a, b) => b.hotdogs - a.hotdogs);
      renderGallery(sortedEntries);
      leaderboardSection.style.display = entries.length === 0 ? 'none' : 'block';
    }

    function showLeaderboardModal() {
      nameInput.value = '';
      imageInput.value = '';
      imagePreview.src = '';
      imagePreview.style.display = 'none';
      leaderboardModal.style.display = 'flex';
      nameInput.focus();
    }

    function hideLeaderboardModal() {
      leaderboardModal.style.display = 'none';
    }


    form.addEventListener('submit', event => {
      event.preventDefault();
      currentHotdogsEaten = Math.min(100, Math.max(0, Number(hotdogsInput.value) || 0));
      const hotdogsRemaining = 100 - currentHotdogsEaten;
      const { daysLeft, weeksLeft } = getDaysAndWeeksLeft();
      const perDay = daysLeft > 0 ? hotdogsRemaining / daysLeft : hotdogsRemaining;
      const perWeek = weeksLeft > 0 ? hotdogsRemaining / weeksLeft : hotdogsRemaining;

      remainingText.textContent = `Hotdogs remaining: ${hotdogsRemaining}`;
      perDayText.textContent = `Hotdogs per day: ${perDay.toFixed(2)}`;
      perWeekText.textContent = `Hotdogs per week: ${perWeek.toFixed(2)}`;
      resultsSection.style.display = 'block';
    });

    hotdogGallery.addEventListener('click', async (event) => {
      const deleteButton = event.target.closest('.gallery-delete');
      if (!deleteButton) return;

      const entryName = deleteButton.getAttribute('data-name');
      if (!entryName) return;

      const confirmed = window.confirm(`Are you sure you want to delete ${entryName} from the leaderboard?`);
      if (!confirmed) return;

      await deleteLeaderboardEntry(entryName);
      displayLeaderboard();
    });

    imageInput.addEventListener('change', () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) {
        imagePreview.src = '';
        imagePreview.style.display = 'none';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        imagePreview.src = reader.result;
        imagePreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    async function submitLeaderboardEntry() {
      if (!nameInput.value.trim()) return;
      const file = imageInput.files && imageInput.files[0];
      const image = file ? await compressImageFile(file) : null;
      await saveScoreToServer(nameInput.value.trim(), image);
      displayLeaderboard();
      hideLeaderboardModal();
    }

    saveToLeaderboardBtn.addEventListener('click', showLeaderboardModal);
    modalSaveBtn.addEventListener('click', submitLeaderboardEntry);
    modalCancelBtn.addEventListener('click', hideLeaderboardModal);
    nameInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter' && nameInput.value.trim()) {
        await submitLeaderboardEntry();
      }
    });

    // Display leaderboard on page load
    displayLeaderboard();
  </script>
</body>
</html>
